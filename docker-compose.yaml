services:
    emarket-server:
        build: 
            context: ./
            dockerfile: ./E-Market.Server/Dockerfile
        depends_on:
            - db-postgres
        ports:
            - "8080:8080"
        networks:
            - private-network
            - public-network  

    db-postgres:
        networks:
            - private-network
        image: postgres:latest
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        container_name: db-postgres
        ports:
            - "5432:5432"

networks:
    private-network:
        driver: bridge
    public-network:
        driver: bridge